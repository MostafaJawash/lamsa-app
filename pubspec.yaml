name: lamsa_app
description: "تطبيق لمسة - متجر مستحضرات التجميل"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  bloc: 9.2.1
  flutter_bloc: 9.1.1
  equatable: 3.0.0
  go_router: 18.1.1
  dio: 5.11.1
  flutter_secure_storage: 11.2.0
  cached_network_image: 4.0.5
  intl: 0.20.3
  firebase_core: 5.0.0
  firebase_messaging: 17.0.0
  google_sign_in: 7.2.0
  json_annotation: 4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  build_runner: 2.16.1
  json_serializable: 6.14.1
  source_helper: 1.3.13
  mocktail: 1.0.5
  bloc_test: 10.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
    - family: ReemKufi
      fonts:
        - asset: assets/fonts/ReemKufi.ttf
